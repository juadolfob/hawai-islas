- id: us_documents
  status: "PARENTS VERIFIED (2026-07-15) — Kid 1 and Kid 2 still needed"
  rule: >
    Mexico is EXEMPT from the "six-month rule" (CBP Six-Month Club): the passport
    only needs to be VALID FOR THE DURATION of the stay, not 6 extra months. The
    B1/B2 card (BCC) works as a full visa when presented with a valid passport,
    even if the passport is newer than the card.
  verified:
    dad:
      passport: "N20455071 · expires 2035-08-28 · OK"
    mom:
      passport: "G23609259 · expires 2027-01-20 · OK (covers the whole trip; Mexico exemption applies)"
      note: "renew the passport at leisure AFTER the trip; the BCC visa stays valid with the new passport"
  still_to_verify:
  - Kid 1
  - Kid 2

