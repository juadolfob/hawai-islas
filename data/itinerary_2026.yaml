  multi_attraction_passes:   # "Go Hawaii package" — a multi-attraction pass, NOT an individual tour
  - name: "Go City: Oahu All-Inclusive Pass (formerly 'Go Oahu Card')"
    what_it_is: "Digital multi-attraction pass with 3 tiers; official catalog of 43 attractions (updated Jul 2026, gocity.com/en/oahu). Includes a choice of 1 premium lūʻau (Ka Moana at Aloha Tower or Aloha Kai at Sea Life Park) ONLY at the All-Inclusive tier."
    area: Whole island (multi-attraction pass)
    rating: 4.0
    reviews: 328
    warnings:
    - Transport to attractions is NOT included except for a few select ones — you normally need your own car or a separate transfer (we already have the Sixt rented, so this is less of an issue)
    - Many attractions require booking a slot ahead even with the pass (marked 'Booking required' on the official site)
    - Free cancellation up to 90 days before the use date (updated official-site policy, more generous than previously reported)
    image: "https://media.tacdn.com/media/attractions-splice-spp-674x446/17/15/50/5f.jpg"
    sources:
    - site: gocity.com
      link: https://gocity.com/en/oahu/passes/all-inclusive
      note: official pricing/tiers page, reviewed Jul 2026
    - site: gocity.com
      link: https://gocity.com/en/oahu/attractions
      note: official full catalog of 43 attractions with the pass tier for each
    - site: viator.com
      link: https://www.viator.com/tours/Oahu/Go-Oahu-Card/d672-3958GOHNL
    tiers:
    - name: Essentials Pass
      what_it_includes: Choose 3 attractions from a catalog of 10 (the most popular/basic ones)
      price_usd: $119.00 adult / $99.00 child (3-12)
      approx_price_mxn: ≈ MX$2,048 adult / MX$1,704 child
      validity: 30 days from first use · free cancellation up to 90 days ahead
    - name: Explorer Pass
      what_it_includes: Choose 3 to 7 attractions from a catalog of 41
      price_usd: from $169.00 adult (3 attractions) — rises with how many you choose
      approx_price_mxn: ≈ MX$2,908 and up
      validity: 30 days from first use · free cancellation up to 90 days ahead
    - name: All-Inclusive Pass
      what_it_includes: Unlimited access to all 43 attractions + a choice of 1 premium lūʻau (Ka Moana or Aloha Kai)
      price_usd: '2 days: $219 adult / $169 child — up to 7 days: $379 adult'
      approx_price_mxn: ≈ MX$3,769 (2 days) up to ≈ MX$6,523 (7 days)
      validity: 14 calendar days from first use · free cancellation up to 90 days ahead
