  pases_multiatraccion:   # "Go Hawaii package" — pase de varias atracciones, NO es un tour individual
  - nombre: "Go City: Oahu All-Inclusive Pass (antes 'Go Oahu Card')"
    que_es: "Pase digital multi-atracción con 3 niveles; catálogo oficial de 43 atracciones (actualizado jul 2026, gocity.com/en/oahu). Incluye 1 lūʻau premium a elegir (Ka Moana en Aloha Tower o Aloha Kai en Sea Life Park) SOLO en el nivel All-Inclusive."
    zona: Toda la isla (pase multi-atracción)
    rating: 4.0
    reviews: 328
    advertencias:
    - El transporte a las atracciones NO está incluido salvo en algunas selectas — normalmente necesitas tu propio auto o pagar traslado aparte (nosotros ya tenemos el Sixt rentado, así que esto es menos problema)
    - Muchas atracciones requieren reservar cupo con anticipación aunque ya tengas el pase (marcadas 'Booking required' en el sitio oficial)
    - Cancelación gratis hasta 90 días antes de la fecha de uso (política actualizada del sitio oficial, más generosa que lo reportado antes)
    imagen: "https://media.tacdn.com/media/attractions-splice-spp-674x446/17/15/50/5f.jpg"
    fuentes:
    - sitio: gocity.com
      link: https://gocity.com/en/oahu/passes/all-inclusive
      nota: página oficial de precios y niveles, revisada jul 2026
    - sitio: gocity.com
      link: https://gocity.com/en/oahu/attractions
      nota: catálogo oficial completo de 43 atracciones con nivel de pase por cada una
    - sitio: viator.com
      link: https://www.viator.com/tours/Oahu/Go-Oahu-Card/d672-3958GOHNL
    niveles:
    - nombre: Essentials Pass
      que_incluye: Elige 3 atracciones de un catálogo de 10 (las más populares/básicas)
      precio_usd: $119.00 adulto / $99.00 niño (3-12)
      precio_mxn_aprox: ≈ MX$2,048 adulto / MX$1,704 niño
      validez: 30 días desde el primer uso · cancelación gratis hasta 90 días antes
    - nombre: Explorer Pass
      que_incluye: Elige de 3 a 7 atracciones de un catálogo de 41
      precio_usd: desde $169.00 adulto (3 atracciones) — sube según cuántas elijas
      precio_mxn_aprox: ≈ MX$2,908 en adelante
      validez: 30 días desde el primer uso · cancelación gratis hasta 90 días antes
    - nombre: All-Inclusive Pass
      que_incluye: Acceso ilimitado a las 43 atracciones + 1 lūʻau premium a elegir (Ka Moana o Aloha Kai)
      precio_usd: '2 días: $219 adulto / $169 niño — hasta 7 días: $379 adulto'
      precio_mxn_aprox: ≈ MX$3,769 (2 días) hasta ≈ MX$6,523 (7 días)
      validez: 14 días calendario desde el primer uso · cancelación gratis hasta 90 días antes
