# =============================================================
# ISLAS DE HAWÁI — TEMÁTICA Y TOP 5 ACTIVIDADES
# =============================================================
# 8 islas principales. 6 turísticamente accesibles; 2 restringidas.
# Ventana de viaje: 17–22 ago 2026 (verano boreal).
# =============================================================

islas_accesibles:

  - nombre: Oʻahu
    apodo: "The Gathering Place"
    capital: Honolulu
    tema: "Capital urbana del estado con Waikiki, Pearl Harbor y vida nocturna; mezcla de historia militar, cultura polinesia y playa accesible."
    top_5_actividades:
      - "Pearl Harbor / USS Arizona Memorial — sitio histórico de la Segunda Guerra Mundial (reserva con antelación; entrada al memorial gratuita)."
      - "Diamond Head (Lēʻahi) — caminata de ~1.3 km al borde del cráter volcánico con vistas a Waikiki (requiere reserva online para no-residentes)."
      - "Hanauma Bay — snorkel en reserva marina protegida (cerrada lunes y martes; cupo limitado)."
      - "North Shore (Haleʻiwa, Waimea, Sunset Beach) — cultura surf, camarones de food truck, tortugas en Laniakea Beach."
      - "Polynesian Cultural Center (Lāʻie) — recorrido por aldeas de seis culturas polinesias + luau nocturno."

  - nombre: Maui
    apodo: "The Valley Isle"
    estado: DESCARTADA
    tema: "Carretera escénica a Hāna, cráter Haleakalā al amanecer, playas de clase mundial y avistamiento de ballenas (sólo nov–abr)."
    top_5_actividades:
      - "Road to Hāna — 100 km de cascadas, miradores y playas (un día completo; requiere conductor descansado)."
      - "Amanecer en Haleakalā — cima a 3 055 m sobre nivel de nubes (reserva obligatoria del National Park; temperatura cercana a 0 °C)."
      - "Snorkel en Molokini — cráter volcánico semi-sumergido con visibilidad de ~30 m (sólo por tour en barco)."
      - "ʻĪao Valley State Monument — valle tropical con la aguja basáltica ʻĪao Needle (320 m)."
      - "Playas de Wailea/Kāʻanapali — aguas calmas, snorkel desde la orilla, atardeceres."
    nota_estacional: "Avistamiento de ballenas jorobadas NO disponible en agosto (temporada nov–abr)."
    razones_de_descarte:
      score_ponderado: 6.95   # tercer lugar; gap de 1.10 puntos vs. Kauaʻi
      atractivo_iconic_fuera_de_temporada: >
        El atractivo de clase mundial de Maui — avistamiento de
        ballenas jorobadas — está fuera de temporada en agosto
        (sólo disponible nov–abr). Esto neutraliza ~40% del valor
        diferencial de la isla en la ventana de viaje.
      sustituibilidad_parcial: >
        Road to Hāna tiene análogos parciales en otras islas
        (Hamakua Coast en Big Island, costa norte de Kauaʻi).
        Snorkel Molokini sustituido por Hanauma Bay (Oʻahu) y
        manta rays nocturno en Kona (Big Island).
      atractivo_unico_remanente: >
        Sólo Haleakalā permanece como atractivo verdaderamente
        único de Maui, pero requiere madrugón extremo (salida
        ~02:30 al cráter) — mismo perfil de fatiga que la
        astronomía en Mauna Kea, sin el plus de los observatorios.
      costo_post_lahaina: >
        Estructura tarifaria de la más alta del archipiélago
        tras incendios de Lahaina 2023 (zona principal de
        alojamiento dañada, oferta reducida, demanda turística
        de recuperación elevada).
      gap_respecto_a_finalistas: >
        En modelo recalibrado, Maui (6.95) queda 1.10 puntos
        debajo de Kauaʻi (8.05) y 1.60 debajo de Big Island
        (8.55). Diferencia significativa, no de margen.

  - nombre: Hawaiʻi (Big Island)
    apodo: "The Orange Island"
    tema: "Volcanes activos (Kīlauea, Mauna Loa) en el Hawaiʻi Volcanoes National Park y observatorios astronómicos en Mauna Kea; única isla con 11 de las 13 zonas climáticas del mundo."
    top_5_actividades:
      - "Hawaiʻi Volcanoes National Park — cráter Kīlauea, Chain of Craters Road, tubos de lava (verificar actividad volcánica vigente con NPS)."
      - "Mauna Kea Summit / Visitor Station — observatorios a 4 207 m y estrellas en el cielo más oscuro de EE.UU. (vehículo 4×4 requerido para la cima)."
      - "Manta Ray Night Snorkel (costa de Kona) — nado nocturno con mantarrayas atraídas por luces, ~3–4 m de envergadura."
      - "Playas de arena negra (Punaluʻu) y arena verde (Papakōlea) — formaciones de olivino y basalto; tortugas marinas frecuentes."
      - "Granjas de café Kona — recorridos de cultivo y cata en la única región productora de café arábica de EE.UU."

  - nombre: Kauaʻi
    apodo: "The Garden Isle"
    estado: DESCARTADA
    tema: "Naturaleza salvaje y verde: acantilados de Nā Pali Coast, Waimea Canyon (el 'Gran Cañón del Pacífico') y selva tropical densa; la más antigua y menos desarrollada de las grandes."
    top_5_actividades:
      - "Nā Pali Coast — acantilados de 1 200 m accesibles sólo por barco, helicóptero o el Kalalau Trail (caminata exigente)."
      - "Waimea Canyon y Kōkeʻe State Park — barranco de 16 km de largo y 900 m de profundidad; múltiples miradores."
      - "Tour en helicóptero de la isla — única forma de ver el ~70% interior inaccesible por tierra."
      - "Hanalei Bay y costa norte — bahía en herradura, playas tropicales clásicas, pueblo histórico."
      - "Río Wailua / Fern Grotto — único río navegable de Hawái; kayak o barco hasta gruta cubierta de helechos."
    razones_de_descarte:
      score_ponderado: 8.05   # segundo lugar — finalista de alto valor
      naturaleza_del_descarte: "Por preferencia, NO por inferioridad. Es una isla magnífica (Σ 8.05, finalista)."
      criterio_no_satisfecho: >
        Los viajeros priorizaron explícitamente astronomía y volcán
        activo. Kauaʻi no tiene ninguno: es la isla más antigua del
        archipiélago, con volcanes extintos y erosionados, y sin
        observatorios astronómicos. Falla 2 de los 3 criterios duros
        nombrados.
      atributo_unico_perdido: >
        Nā Pali Coast y Waimea Canyon son paisajes sin equivalente,
        pero ceden ante la prioridad declarada de los viajeros.

  - nombre: Molokaʻi
    apodo: "The Friendly Isle"
    estado: DESCARTADA
    tema: "Hawái rural y tradicional sin grandes resorts; cultura nativa intacta y el histórico asentamiento de leprosos de Kalaupapa."
    top_5_actividades:
      - "Kalaupapa National Historical Park — antigua colonia de leprosos del Padre Damián (acceso por mula, avión o caminata; verificar reapertura)."
      - "Hālawa Valley — caminata cultural guiada por residente nativo hasta cascadas Moaʻula."
      - "Papōhaku Beach — playa de arena blanca de 5 km, la más larga del estado; generalmente vacía."
      - "Acantilados marinos del norte — los más altos del mundo (~1 000 m), visibles desde mar o aire."
      - "Pueblo de Kaunakakai — vida local sin franquicias ni semáforos; pan dulce nocturno en Kanemitsu Bakery."
    razones_de_descarte:
      score_ponderado: 5.60   # penúltimo lugar
      atractivo_principal_comprometido: >
        Kalaupapa (motivo histórico nº 1) tiene acceso operacionalmente
        cerrado desde 2018: mule trail suspendido indefinidamente tras
        deslizamiento + retiro de Damien Tours. Acceso restante por
        vuelo charter requiere permiso del Hawaii Department of Health
        gestionado con semanas de antelación, sin garantía.
      sustituibilidad_del_resto: >
        Sin Kalaupapa, los atractivos remanentes (Hālawa Valley, Papōhaku
        Beach, acantilados, pueblo rural) tienen sustitutos en Oʻahu o
        Big Island sin pérdida material de experiencia.
      friccion_operativa: >
        Único vuelo desde HNL es Mokulele Airlines (Cessna 9 plazas) con
        2–4 frecuencias diarias; restricción de peso 70 lbs/pasajero;
        riesgo de separación del grupo si no hay 4 asientos contiguos.
      infraestructura_minima: >
        Un único hotel operativo; 0 semáforos en toda la isla; 0
        franquicias internacionales; restaurantes cierran antes de
        las 21:00. Sin redundancia ante cancelaciones.
      mismatch_cultural: >
        Molokaʻi mantiene postura documentada anti-turismo de masas;
        target receptor es el viajero experimentado con interés
        antropológico, no la familia en su primera visita al archipiélago.

  - nombre: Lānaʻi
    apodo: "The Pineapple Isle"
    estado: DESCARTADA
    tema: "Isla pequeña y privada con sólo dos resorts de lujo (ambos Four Seasons), playas remotas y rutas off-road; antigua plantación de piña de Dole."
    top_5_actividades:
      - "Hulopoʻe Bay — santuario marino protegido; snorkel con delfines y peces tropicales desde la orilla."
      - "Keahiakawelo (Garden of the Gods) — paisaje rocoso lunar con formaciones erosionadas color rojizo."
      - "Shipwreck Beach (Kaiolohia) — restos oxidados de buque petrolero de la Segunda Guerra Mundial visibles desde la playa."
      - "Munro Trail — sendero de 20 km por la cresta de la isla; vistas a otras cinco islas en día despejado (requiere 4×4)."
      - "Puʻu Pehe (Sweetheart Rock) — formación rocosa icónica frente a la costa sur con leyenda hawaiana."
    razones_de_descarte:
      score_ponderado: 5.05   # último lugar del universo de opciones
      dominancia_estricta: >
        Los 5 atractivos tienen sustitutos superiores en otras islas
        del mismo viaje (Hanauma/Molokini > Hulopoʻe; Waimea Canyon
        > Garden of the Gods; Nā Pali > Puʻu Pehe). Ninguno es único
        o de clase mundial.
      category_mismatch: >
        Producto orientado a luna de miel, retiro de bienestar o
        escapada corporativa. No alinea con perfil de viaje familiar
        inaugural de 4 adultos buscando variedad.
      costo_prohibitivo: >
        Sólo 2 hoteles operan (ambos Four Seasons); tarifa mínima
        USD 1100–1800/noche. Sin segmento medio ni bajo. 2 noches
        para 4 personas: USD 4400–7200 mínimo en alojamiento.
      vulnerabilidad_logistica: >
        Sin renta de auto convencional; sólo Jeep 4×4 (~USD 200/día)
        por carreteras no pavimentadas. Dependencia operacional del
        shuttle del resort elimina autonomía exploratoria.
      costo_oportunidad: >
        Mismo presupuesto en Big Island cubre hotel + 4×4 + tour de
        mantarrayas + entrada al National Park con margen sobrante.

islas_restringidas:

  - nombre: Niʻihau
    apodo: "The Forbidden Isle"
    tema: "Propiedad privada desde 1864, habitada por ~70 nativos hawaianos; acceso sólo mediante tours limitados de cacería o helicóptero."

  - nombre: Kahoʻolawe
    tema: "Deshabitada, antiguo campo de tiro militar en proceso de restauración ecológica; acceso prohibido al público general."

# =============================================================
# NOTAS LOGÍSTICAS
# =============================================================
notas:
  conectividad: "Vuelos interisla operados principalmente por Hawaiian Airlines y Southwest; ~40 min de duración típica."
  punto_de_entrada_actual: "Oʻahu (HNL) — base ya fijada por reserva United."
  costo_island_hop: "Vuelo interisla añade traslados adicionales aeropuerto↔hotel y consume medio día por trayecto; evaluar contra noches disponibles (5)."
  reservas_anticipadas_criticas:
    - "Pearl Harbor (USS Arizona): boletos liberan a 8 semanas vista; agotan rápido."
    - "Hanauma Bay: reserva en línea 48 h antes; cupo diario limitado."
    - "Diamond Head: reserva obligatoria para no-residentes."
    - "Haleakalā sunrise (Maui): reserva del National Park requerida con 60 días de anticipación."
    - "Molokini snorkel: tours suelen llenarse 1–2 semanas antes en verano."

# =============================================================
# DECISIÓN ACTIVA — UNIVERSO FINAL DE 2 OPCIONES
# =============================================================
decision_segunda_isla:
  restriccion_clave: "Primera y posiblemente única visita al archipiélago — modelo recalibrado prioriza diferenciación e iconicity sobre simplicidad operativa."

  RESUELTA: "Oʻahu + Big Island"
  criterio_decisivo: "Conjunto de preferencias {astronomía, volcán activo, naturaleza} tiene solución única: Big Island es la ÚNICA isla con astronomía (Mauna Kea) Y volcán activo (Kīlauea). Kauaʻi falla 2 de 3 criterios duros nombrados por los viajeros."
  fecha_decision: 2026-05-18

  seleccion_final:
    nombre: "Oʻahu + Big Island"
    score_recalibrado: 8.55
    rank: 1
    estado: SELECCIONADA

  opciones_descartadas:
    - nombre: "Oʻahu + Kauaʻi"
      score: 8.05
      motivo: "Finalista de alto valor, pero sin astronomía ni volcán activo — los dos atributos exclusivos que los viajeros priorizaron explícitamente. Descartada por preferencia, no por inferioridad."
    - nombre: "Oʻahu + Maui"
      score: 6.95
      motivo: "Atractivo iconic principal (ballenas) fuera de temporada; costo elevado post-Lahaina; gap de 1.10 puntos vs. finalistas."
    - nombre: "Sólo Oʻahu"
      score: 6.80
      motivo: "Bajo restricción 'primera y posiblemente única visita', renunciar a volcanes activos / Mauna Kea / Nā Pali / mantarrayas representa pérdida permanente no compensable."
    - nombre: "Oʻahu + Molokaʻi"
      score: 5.85
      motivo: "Atractivo nº 1 (Kalaupapa) operacionalmente cerrado; infraestructura mínima; mismatch cultural."
    - nombre: "Oʻahu + Lānaʻi"
      score: 5.00
      motivo: "Dominancia estricta por finalistas; costo prohibitivo; category mismatch con perfil familiar."
