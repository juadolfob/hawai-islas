# =============================================================
# HAWAIIAN ISLANDS — THEME AND TOP 5 ACTIVITIES
# =============================================================
# 8 main islands. 6 tourist-accessible; 2 restricted.
# Travel window: Aug 17-22, 2026 (northern summer).
# =============================================================

accessible_islands:

  - name: Oʻahu
    nickname: "The Gathering Place"
    capital: Honolulu
    theme: "The state's urban capital, home to Waikiki, Pearl Harbor and nightlife; a mix of military history, Polynesian culture and accessible beach."
    top_5_activities:
      - "Pearl Harbor / USS Arizona Memorial — WWII historic site (book ahead; memorial entry is free)."
      - "Diamond Head (Lēʻahi) — ~1.3 km hike to the rim of the volcanic crater with views of Waikiki (online reservation required for non-residents)."
      - "Hanauma Bay — snorkeling in a protected marine reserve (closed Mondays and Tuesdays; limited daily capacity)."
      - "North Shore (Haleʻiwa, Waimea, Sunset Beach) — surf culture, food-truck shrimp, turtles at Laniakea Beach."
      - "Polynesian Cultural Center (Lāʻie) — tour through six Polynesian-culture villages + evening luau."

  - name: Maui
    nickname: "The Valley Isle"
    status: DROPPED
    theme: "The scenic Road to Hāna, sunrise at Haleakalā crater, world-class beaches and whale watching (Nov-Apr only)."
    top_5_activities:
      - "Road to Hāna — 100 km of waterfalls, lookouts and beaches (a full day; needs a well-rested driver)."
      - "Sunrise at Haleakalā — a 3,055 m summit above the cloud line (National Park reservation required; near-freezing temperatures)."
      - "Molokini snorkel — a partly submerged volcanic crater with ~30 m visibility (boat tour only)."
      - "ʻĪao Valley State Monument — tropical valley with the basalt ʻĪao Needle (320 m)."
      - "Wailea/Kāʻanapali beaches — calm waters, shore snorkeling, sunsets."
    seasonal_note: "Humpback whale watching NOT available in August (season is Nov-Apr)."
    reasons_dropped:
      weighted_score: 6.95   # third place; 1.10-point gap vs. Kauaʻi
      iconic_draw_out_of_season: >
        Maui's world-class draw — humpback whale watching —
        is out of season in August (only available Nov-Apr).
        This neutralizes ~40% of the island's differential value
        within the travel window.
      partial_substitutability: >
        Road to Hāna has partial equivalents on other islands
        (Hamakua Coast on Big Island, Kauaʻi's north shore).
        Molokini snorkel is substituted by Hanauma Bay (Oʻahu) and
        the night manta ray swim in Kona (Big Island).
      remaining_unique_draw: >
        Only Haleakalā remains as a truly unique Maui draw, but it
        requires an extreme early start (~02:30 departure to the
        crater) — the same fatigue profile as Mauna Kea astronomy,
        without the observatory payoff.
      cost_post_lahaina: >
        The highest rate structure in the archipelago following the
        2023 Lahaina fires (main lodging area damaged, reduced
        supply, elevated recovery-driven tourist demand).
      gap_vs_finalists: >
        In the recalibrated model, Maui (6.95) sits 1.10 points
        below Kauaʻi (8.05) and 1.60 below Big Island (8.55). A
        meaningful gap, not a marginal one.

  - name: Hawaiʻi (Big Island)
    nickname: "The Orange Island"
    theme: "Active volcanoes (Kīlauea, Mauna Loa) inside Hawaiʻi Volcanoes National Park and astronomical observatories on Mauna Kea; the only island with 11 of the world's 13 climate zones."
    top_5_activities:
      - "Hawaiʻi Volcanoes National Park — Kīlauea crater, Chain of Craters Road, lava tubes (check current volcanic activity with NPS)."
      - "Mauna Kea Summit / Visitor Station — observatories at 4,207 m and stargazing under the darkest sky in the US (4x4 required for the summit)."
      - "Manta Ray Night Snorkel (Kona coast) — a night swim with manta rays drawn in by lights, ~3-4 m wingspan."
      - "Black sand (Punaluʻu) and green sand (Papakōlea) beaches — olivine and basalt formations; sea turtles common."
      - "Kona coffee farms — tours and tastings in the only Arabica-coffee-growing region in the US."

  - name: Kauaʻi
    nickname: "The Garden Isle"
    status: DROPPED
    theme: "Wild, green nature: the Nā Pali Coast cliffs, Waimea Canyon (the 'Grand Canyon of the Pacific') and dense rainforest; the oldest and least developed of the major islands."
    top_5_activities:
      - "Nā Pali Coast — 1,200 m cliffs reachable only by boat, helicopter or the Kalalau Trail (a demanding hike)."
      - "Waimea Canyon and Kōkeʻe State Park — a canyon 16 km long and 900 m deep; multiple overlooks."
      - "Island helicopter tour — the only way to see the ~70% of the interior that's inaccessible by land."
      - "Hanalei Bay and the north shore — a horseshoe bay, classic tropical beaches, a historic town."
      - "Wailua River / Fern Grotto — Hawaii's only navigable river; kayak or boat to a fern-covered grotto."
    reasons_dropped:
      weighted_score: 8.05   # second place — a high-value finalist
      nature_of_the_drop: "Dropped by preference, NOT by inferiority. This is a magnificent island (Σ 8.05, a finalist)."
      unmet_criterion: >
        The travelers explicitly prioritized astronomy and an active
        volcano. Kauaʻi has neither: it's the oldest island in the
        archipelago, with extinct and eroded volcanoes and no
        astronomical observatories. It fails 2 of the 3 hard criteria
        the travelers named.
      unique_attribute_lost: >
        Nā Pali Coast and Waimea Canyon are landscapes with no
        equivalent, but they lose out to the travelers' stated
        priority.

  - name: Molokaʻi
    nickname: "The Friendly Isle"
    status: DROPPED
    theme: "Rural, traditional Hawaii with no large resorts; intact native culture and the historic Kalaupapa leprosy settlement."
    top_5_activities:
      - "Kalaupapa National Historical Park — Father Damien's former leprosy colony (access by mule, plane or hike; check reopening status)."
      - "Hālawa Valley — a cultural hike guided by a native resident up to Moaʻula Falls."
      - "Papōhaku Beach — a 5 km white-sand beach, the longest in the state; usually empty."
      - "North shore sea cliffs — the tallest in the world (~1,000 m), visible from sea or air."
      - "Kaunakakai town — local life with no chains or traffic lights; night-time sweet bread at Kanemitsu Bakery."
    reasons_dropped:
      weighted_score: 5.60   # second-to-last place
      main_draw_compromised: >
        Kalaupapa (the #1 historical draw) has been operationally
        closed since 2018: the mule trail has been suspended
        indefinitely following a landslide + the withdrawal of Damien
        Tours. The remaining charter-flight access requires a permit
        from the Hawaii Department of Health arranged weeks in
        advance, with no guarantee.
      substitutability_of_the_rest: >
        Without Kalaupapa, the remaining draws (Hālawa Valley,
        Papōhaku Beach, sea cliffs, the rural town) have substitutes
        on Oʻahu or Big Island with no material loss of experience.
      operational_friction: >
        The only flight from HNL is Mokulele Airlines (9-seat Cessna)
        with 2-4 daily frequencies; a 70 lbs/passenger weight
        restriction; risk of the group getting split if 4 adjoining
        seats aren't available.
      minimal_infrastructure: >
        A single operating hotel; 0 traffic lights on the entire
        island; 0 international chains; restaurants close before
        9:00 pm. No redundancy against cancellations.
      cultural_mismatch: >
        Molokaʻi maintains a documented anti-mass-tourism stance;
        its intended visitor is the experienced traveler with an
        anthropological interest, not a family on their first visit
        to the archipelago.

  - name: Lānaʻi
    nickname: "The Pineapple Isle"
    status: DROPPED
    theme: "A small, private island with only two luxury resorts (both Four Seasons), remote beaches and off-road routes; a former Dole pineapple plantation."
    top_5_activities:
      - "Hulopoʻe Bay — a protected marine sanctuary; shore snorkeling with dolphins and tropical fish."
      - "Keahiakawelo (Garden of the Gods) — a lunar rocky landscape with reddish eroded formations."
      - "Shipwreck Beach (Kaiolohia) — the rusted remains of a WWII oil tanker visible from the beach."
      - "Munro Trail — a 20 km ridge trail across the island; views of five other islands on a clear day (4x4 required)."
      - "Puʻu Pehe (Sweetheart Rock) — an iconic rock formation off the south coast with a Hawaiian legend attached."
    reasons_dropped:
      weighted_score: 5.05   # last place among all options
      strict_dominance: >
        All 5 draws have superior substitutes on other islands in
        the same trip (Hanauma/Molokini > Hulopoʻe; Waimea Canyon >
        Garden of the Gods; Nā Pali > Puʻu Pehe). None is unique or
        world-class.
      category_mismatch: >
        A product built for honeymoons, wellness retreats or
        corporate getaways. Doesn't fit a first-time family trip of
        4 adults looking for variety.
      prohibitive_cost: >
        Only 2 hotels operate (both Four Seasons); minimum rate
        USD 1,100-1,800/night. No mid- or low-tier segment. 2 nights
        for 4 people: USD 4,400-7,200 minimum in lodging alone.
      logistical_vulnerability: >
        No conventional car rental; only 4x4 Jeeps (~USD 200/day) on
        unpaved roads. Operational dependence on the resort shuttle
        removes exploratory freedom.
      opportunity_cost: >
        The same budget on Big Island covers a hotel + 4x4 + manta
        ray tour + National Park entry with money to spare.

restricted_islands:

  - name: Niʻihau
    nickname: "The Forbidden Isle"
    theme: "Privately owned since 1864, home to ~70 native Hawaiians; access only via limited hunting or helicopter tours."

  - name: Kahoʻolawe
    theme: "Uninhabited, a former military firing range under ecological restoration; off-limits to the general public."

# =============================================================
# LOGISTICS NOTES
# =============================================================
notes:
  connectivity: "Interisland flights mainly run by Hawaiian Airlines and Southwest; ~40 min typical duration."
  current_entry_point: "Oʻahu (HNL) — base already fixed by the United booking."
  island_hop_cost: "An interisland flight adds extra airport-hotel transfers and eats up half a day per leg; weigh this against the nights available (5)."
  critical_advance_bookings:
    - "Pearl Harbor (USS Arizona): tickets release 8 weeks out; sell out fast."
    - "Hanauma Bay: book online 48h ahead; limited daily capacity."
    - "Diamond Head: reservation required for non-residents."
    - "Haleakalā sunrise (Maui): National Park reservation required 60 days ahead."
    - "Molokini snorkel: tours often sell out 1-2 weeks ahead in summer."

