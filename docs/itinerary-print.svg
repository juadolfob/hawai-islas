  <text x="410" y="1265" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0369a1">💼 Interview (Kid 3)</text>
  <text x="410" y="1295" font-family="Arial, sans-serif" font-size="16" fill="#475569">Scheduled for this day.</text>
  <text x="410" y="1320" font-family="Arial, sans-serif" font-size="16" fill="#475569">Have the laptop ready.</text>

