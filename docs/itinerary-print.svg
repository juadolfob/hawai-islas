  <text x="70" y="1290" font-family="Arial, sans-serif" font-size="16" fill="#475569">17:30 - Return Sixt car (BMW X3).</text>
  <text x="70" y="1315" font-family="Arial, sans-serif" font-size="16" fill="#475569">18:30 - Arrival at HNL airport.</text>
  <text x="70" y="1340" font-family="Arial, sans-serif" font-size="16" fill="#475569">21:40 - Flight UA1806 departs to Denver.</text>

