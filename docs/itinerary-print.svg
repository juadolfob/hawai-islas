  <rect x="50" y="1400" width="700" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="1440" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">✈️ Sun Aug 23 - Arrival in CDMX</text>
  <text x="70" y="1475" font-family="Arial, sans-serif" font-size="16" fill="#475569">21:10 - Landing in CDMX (MEX).</text>
  <text x="70" y="1500" font-family="Arial, sans-serif" font-size="16" fill="#475569">Transfer and overnight in CDMX.</text>

  <!-- Day 9: 24 Ago -->
  <rect x="50" y="1560" width="700" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="1600" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">✈️ Mon Aug 24 - Return Home</text>
  <text x="70" y="1635" font-family="Arial, sans-serif" font-size="16" fill="#475569">06:40 - Flight: Viva Aerobus (NLU to CEN). Conf: XXXXXX.</text>
  <text x="70" y="1660" font-family="Arial, sans-serif" font-size="16" fill="#475569">07:55 - Landing in Ciudad Obregón. The end!</text>

  <!-- Notes -->
  <rect x="50" y="1720" width="700" height="140" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="70" y="1760" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b45309">📌 Important Notes</text>
  <text x="70" y="1795" font-family="Arial, sans-serif" font-size="16" fill="#92400e">• Hotel: approx. US$1,644 payment pending around August 3.</text>
  <text x="70" y="1820" font-family="Arial, sans-serif" font-size="16" fill="#92400e">• Signatures: remember to sign the Kualoa and Go Tours Hawaii waivers beforehand.</text>
  <text x="70" y="1845" font-family="Arial, sans-serif" font-size="16" fill="#92400e">• ID: bring photo ID matching each name to all activities.</text>

