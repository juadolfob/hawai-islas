  <text x="70" y="440" font-family="Arial, sans-serif" font-size="16" fill="#475569">13:34 - Landing in Honolulu (HNL).</text>
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="16" fill="#475569">14:30 - Car pickup: Sixt (BMW X3).</text>
  <text x="70" y="490" font-family="Arial, sans-serif" font-size="16" fill="#475569">Afternoon - Hotel check-in: The Twin Fin Waikiki (#XXXXXXXX).</text>

