  <rect x="50" y="180" width="700" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">✈️ Sun Aug 16 - Departure to CDMX</text>
  <text x="70" y="255" font-family="Arial, sans-serif" font-size="16" fill="#475569">09:40 - Flight: Viva Aerobus (CEN to NLU). Conf: XXXXXX.</text>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="16" fill="#475569">14:40 - Landing in CDMX. Overnight in CDMX.</text>

